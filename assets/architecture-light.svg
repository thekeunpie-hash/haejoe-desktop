  <text x="898" y="242" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">strictly inside approved folders</text>

  <rect x="884" y="268" width="254" height="72" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

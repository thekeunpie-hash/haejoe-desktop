  <g transform="translate(438, 444)">
    <path d="M5 11V7.5a5 5 0 0 1 10 0V11" fill="none" stroke="#047857" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="2.5" y="11" width="15" height="12" rx="3" fill="#059669"/>
    <circle cx="10" cy="17" r="1.7" fill="#ffffff"/>

  <text x="466" y="208" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Policy &amp; Owner Approval Gate</text>

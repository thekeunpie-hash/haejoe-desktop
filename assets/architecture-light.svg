  <text x="898" y="406" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">dispatched straight from your PC</text>

  <rect x="884" y="432" width="254" height="72" rx="9" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="898" y="454" fill="#064e3b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Verified Proof Receipts</text>
  <text x="898" y="472" fill="#047857" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Test logs, diffs, and decision cards</text>
  <text x="898" y="488" fill="#047857" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">delivered to your Control Desk</text>

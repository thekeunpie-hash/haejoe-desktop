  <rect x="884" y="350" width="254" height="72" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="898" y="372" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Scoped HTTP, AWS &amp; DB</text>

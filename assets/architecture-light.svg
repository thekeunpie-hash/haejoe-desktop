  <text x="76" y="347" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Claude · ChatGPT · Gemini</text>

  <text x="64" y="384" fill="#3140e9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5">Sees opaque handles only: cred_…</text>


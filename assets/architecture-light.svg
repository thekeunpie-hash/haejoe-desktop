  <text x="44" y="72" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.4">Delegation Without Exposure</text>

  <rect x="872" y="36" width="284" height="32" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>

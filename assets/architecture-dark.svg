<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Haejoe Desktop Architecture — Delegation Without Exposure">
  <defs>
    <linearGradient id="arch-bg-dark" x1="0" y1="0" x2="1200" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090c14"/>
      <stop offset="100%" stop-color="#0d1220"/>
    </linearGradient>
    <radialGradient id="arch-glow-d" cx="50%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#3140e9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3140e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="arch-dots-d" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <marker id="arrow-indigo-d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#818cf8"/>
    </marker>
    <marker id="arrow-emerald-d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-sky-d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0.5" y="0.5" width="1199" height="559" rx="20" fill="url(#arch-bg-dark)" stroke="#1e2740" stroke-width="1"/>
  <rect x="1" y="1" width="1198" height="558" rx="19.5" fill="url(#arch-dots-d)"/>
  <rect x="1" y="1" width="1198" height="558" rx="19.5" fill="url(#arch-glow-d)"/>

  <!-- Header -->
  <text x="44" y="42" fill="#818cf8" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="600" letter-spacing="1.1">ZERO-TRUST LOCAL EXECUTION PIPELINE</text>
  <text x="44" y="72" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.4">Delegation Without Exposure</text>

  <rect x="872" y="36" width="284" height="32" rx="16" fill="#0d2620" stroke="#185745" stroke-width="1"/>
  <circle cx="890" cy="52" r="4" fill="#34d399"/>
  <text x="902" y="56" fill="#6ee7b7" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="600">Raw secrets never enter LLM context</text>

  <!-- Security Boundary Line -->
  <line x1="376" y1="96" x2="376" y2="528" stroke="#3140e9" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="6 6"/>
  <rect x="306" y="88" width="140" height="22" rx="11" fill="#171f3b" stroke="#3d4f94" stroke-width="1"/>
  <text x="376" y="102.5" text-anchor="middle" fill="#a5b4fc" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" font-weight="600">SECRET BOUNDARY</text>

  <!-- Column 1: AI Agents -->
  <rect x="44" y="122" width="290" height="278" rx="14" fill="#111625" stroke="#222c47" stroke-width="1.2"/>
  <text x="64" y="146" fill="#94a3b8" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" font-weight="600" letter-spacing="0.8">01 · AGENT LAYER</text>
  <text x="64" y="168" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Your Connected AIs</text>

  <rect x="62" y="184" width="254" height="52" rx="9" fill="#171e32" stroke="#283557" stroke-width="1"/>
  <text x="76" y="205" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Local Coding CLIs</text>
  <text x="76" y="223" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Claude Code · Codex · Antigravity</text>

  <rect x="62" y="246" width="254" height="52" rx="9" fill="#171e32" stroke="#283557" stroke-width="1"/>
  <text x="76" y="267" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">IDEs &amp; Autonomous Workers</text>
  <text x="76" y="285" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Cursor · VS Code · Devin · Gemini CLI</text>

  <rect x="62" y="308" width="254" height="52" rx="9" fill="#171e32" stroke="#283557" stroke-width="1"/>
  <text x="76" y="329" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Web AI Connectors (MCP)</text>
  <text x="76" y="347" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Claude · ChatGPT · Gemini</text>

  <text x="64" y="384" fill="#818cf8" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5">Sees opaque handles only: cred_…</text>

  <!-- Left Bottom: Isolation Guarantees -->
  <rect x="44" y="420" width="290" height="104" rx="14" fill="#101522" stroke="#202a42" stroke-width="1"/>
  <text x="64" y="444" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Hard Isolation Guarantees</text>
  <text x="64" y="467" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">· Never placed in prompts or chat history</text>
  <text x="64" y="487" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">· Never uploaded to Haejoe servers</text>
  <text x="64" y="507" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">· Instant one-click grant revocation</text>

  <!-- Arrows Col 1 <-> Col 2 -->
  <line x1="336" y1="226" x2="414" y2="226" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow-indigo-d)"/>
  <text x="375" y="215" text-anchor="middle" fill="#a5b4fc" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5">handle</text>

  <line x1="414" y1="292" x2="336" y2="292" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald-d)"/>
  <text x="375" y="309" text-anchor="middle" fill="#6ee7b7" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5">sanitized</text>

  <!-- Column 2: Haejoe Desktop Local Broker -->
  <rect x="418" y="122" width="364" height="278" rx="14" fill="#12182d" stroke="#4456c9" stroke-width="1.5"/>
  <text x="438" y="146" fill="#818cf8" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" font-weight="600" letter-spacing="0.8">02 · LOCAL CONTROL PLANE · 127.0.0.1</text>
  <text x="438" y="168" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Haejoe Desktop Broker</text>

  <rect x="436" y="184" width="328" height="58" rx="9" fill="#18203c" stroke="#31417d" stroke-width="1"/>
  <circle cx="454" cy="204" r="4" fill="#818cf8"/>
  <text x="466" y="208" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Policy &amp; Owner Approval Gate</text>
  <text x="466" y="227" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Enforces folder scope, allowlists &amp; owner sign-off</text>

  <rect x="436" y="252" width="328" height="58" rx="9" fill="#18203c" stroke="#31417d" stroke-width="1"/>
  <circle cx="454" cy="272" r="4" fill="#34d399"/>
  <text x="466" y="276" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Blind In-Memory Credential Broker</text>
  <text x="466" y="295" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Resolves handle in-memory at execution boundary</text>

  <rect x="436" y="320" width="328" height="58" rx="9" fill="#18203c" stroke="#31417d" stroke-width="1"/>
  <circle cx="454" cy="340" r="4" fill="#38bdf8"/>
  <text x="466" y="344" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Output Scrubber &amp; Audit Trail</text>
  <text x="466" y="363" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Redacts secrets &amp; cookies before returning logs</text>

  <!-- Vertical Vault Connection -->
  <line x1="600" y1="402" x2="600" y2="420" stroke="#34d399" stroke-width="2" marker-start="url(#arrow-emerald-d)" marker-end="url(#arrow-emerald-d)"/>
  <text x="614" y="414" fill="#6ee7b7" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5">local OS store only</text>

  <!-- Bottom Vault Box -->
  <rect x="418" y="424" width="364" height="100" rx="14" fill="#0d1f1c" stroke="#1b5e4a" stroke-width="1.4"/>
  <g transform="translate(438, 444)">
    <path d="M5 11V7.5a5 5 0 0 1 10 0V11" fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="2.5" y="11" width="15" height="12" rx="3" fill="#10b981"/>
    <circle cx="10" cy="17" r="1.7" fill="#06281f"/>
  </g>
  <text x="470" y="454" fill="#ecfdf5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700">OS-Encrypted Credential Vault</text>
  <text x="470" y="476" fill="#6ee7b7" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="600">Windows DPAPI · macOS Keychain</text>
  <text x="470" y="500" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">Seller logins · AWS · DB · SSH · API keys stay on this PC</text>

  <!-- Arrows Col 2 <-> Col 3 -->
  <line x1="784" y1="226" x2="862" y2="226" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-sky-d)"/>
  <text x="823" y="215" text-anchor="middle" fill="#7dd3fc" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5">exec</text>

  <line x1="862" y1="292" x2="784" y2="292" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald-d)"/>
  <text x="823" y="309" text-anchor="middle" fill="#6ee7b7" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5">proof</text>

  <!-- Column 3: Execution Targets -->
  <rect x="866" y="122" width="290" height="402" rx="14" fill="#111625" stroke="#222c47" stroke-width="1.2"/>
  <text x="886" y="146" fill="#38bdf8" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" font-weight="600" letter-spacing="0.8">03 · EXECUTION TARGETS</text>
  <text x="886" y="168" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Real Work, Done Locally</text>

  <rect x="884" y="186" width="254" height="72" rx="9" fill="#171e32" stroke="#283557" stroke-width="1"/>
  <text x="898" y="208" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Local Workspace &amp; Git</text>
  <text x="898" y="226" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Repo edits, builds, and test suites</text>
  <text x="898" y="242" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">strictly inside approved folders</text>

  <rect x="884" y="268" width="254" height="72" rx="9" fill="#171e32" stroke="#283557" stroke-width="1"/>
  <text x="898" y="290" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Off-Screen Browser (ABUA)</text>
  <text x="898" y="308" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Isolated agent Chrome with zero</text>
  <text x="898" y="324" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">mouse, keyboard, or focus takeover</text>

  <rect x="884" y="350" width="254" height="72" rx="9" fill="#171e32" stroke="#283557" stroke-width="1"/>
  <text x="898" y="372" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Scoped HTTP, AWS &amp; DB</text>
  <text x="898" y="390" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Signed requests, SigV4, and queries</text>
  <text x="898" y="406" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">dispatched straight from your PC</text>

  <rect x="884" y="432" width="254" height="72" rx="9" fill="#142322" stroke="#1e5947" stroke-width="1"/>
  <text x="898" y="454" fill="#ecfdf5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Verified Proof Receipts</text>
  <text x="898" y="472" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Test logs, diffs, and decision cards</text>
  <text x="898" y="488" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">delivered to your Control Desk</text>
</svg>
